resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

serviceAccount:
  create: true
  name: cloudwatch-exporter
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::788292453615:role/finledger-cloudwatch-exporter-role

config: |-
  apiVersion: v1alpha1
  sts-region: ap-south-1
  discovery:
    jobs:
    - type: AWS/SQS
      regions:
        - ap-south-1
      metrics:
        - name: ApproximateNumberOfMessagesVisible
          statistics:
          - Average
          period: 60
          length: 300
        - name: ApproximateNumberOfMessagesNotVisible
          statistics:
          - Average
          period: 60
          length: 300