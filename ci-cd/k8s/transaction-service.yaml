apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
  namespace: finledger
  labels:
    app: transaction-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: transaction-service
  template:
    metadata:
      labels:
        app: transaction-service
    spec:
      containers:
        - name: transaction-service
          image: 788292453615.dkr.ecr.ap-south-1.amazonaws.com/finledger-transaction-service:initial
          ports:
            - containerPort: 8003
          envFrom:
            - secretRef:
                name: finledger-db-credentials
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "250m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-service
  namespace: finledger
spec:
  selector:
    app: transaction-service
  ports:
    - name: http
    - port: 80
      targetPort: 8003
  type: ClusterIP