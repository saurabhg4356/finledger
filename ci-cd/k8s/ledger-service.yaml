apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-service
  namespace: finledger
  labels:
    app: ledger-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ledger-service
  template:
    metadata:
      labels:
        app: ledger-service
    spec:
      containers:
        - name: ledger-service
          image: 372014757729.dkr.ecr.ap-south-1.amazonaws.com/finledger-ledger-service:initial
          ports:
            - containerPort: 8002
          envFrom:
            - secretRef:
                name: finledger-db-credentials
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "250m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-service
  namespace: finledger
spec:
  selector:
    app: ledger-service
  ports:
    - port: 80
      targetPort: 8002
  type: ClusterIP