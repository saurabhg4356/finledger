# NOT applied automatically and NEVER commit a real filled-in version of this
# to git. This documents the shape of the Secret each service expects.
#
# Create the real one manually for now with:
#   kubectl create secret generic finledger-db-credentials \
#     --namespace finledger \
#     --from-literal=DB_HOST=<rds-endpoint-from-terraform-output> \
#     --from-literal=DB_NAME=finledger \
#     --from-literal=DB_USER=finledger_admin \
#     --from-literal=DB_PASSWORD=<from-secrets-manager> \
#     --from-literal=REDIS_HOST=<elasticache-endpoint-from-terraform-output>
#
# This manual step is a known, deliberate gap — Phase 8 replaces it with
# External Secrets Operator syncing directly from AWS Secrets Manager, so the
# real credentials never touch a human's clipboard or shell history in the
# steady state. Doing it manually here first is what makes that upgrade a
# clear, demonstrable "before/after" instead of something bolted on from day one.
apiVersion: v1
kind: Secret
metadata:
  name: finledger-db-credentials
  namespace: finledger
type: Opaque
stringData:
  DB_HOST: "REPLACE_ME"
  DB_NAME: "finledger"
  DB_USER: "REPLACE_ME"
  DB_PASSWORD: "REPLACE_ME"
  REDIS_HOST: "REPLACE_ME"