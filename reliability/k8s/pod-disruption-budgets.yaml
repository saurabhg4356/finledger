# ------------------------------------------------------------------------------
# One PDB per 2-replica service. minAvailable: 1 means: no voluntary
# disruption (drain, rollout, cluster scale-down) may proceed if it would
# drop available replicas below 1 — the second disruption in a rapid
# back-to-back pair gets BLOCKED until the first pod's replacement is Ready.
#
# outbox-poller is deliberately NOT given a PDB here: it runs at replicas=1
# (see Phase 6), and a PDB with minAvailable=1 on a single-replica Deployment
# would block ALL voluntary disruption of it forever — including legitimate
# node maintenance and rolling deploys. This is a real, named trade-off: the
# poller is currently a single point of disruption. The honest fix is
# increasing its replica count (safe to do — see Phase 6's SKIP LOCKED note)
# rather than papering over it with a PDB that can't actually help at
# replicas=1.
# ------------------------------------------------------------------------------
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: account-service-pdb
  namespace: finledger
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: account-service
---
