apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: transaction-service
  namespace: finledger
  labels:
    release: kube-prometheus-stack # harmless if unused given the open selectors in values.yaml, but kept for clarity/consistency with chart conventions
spec:
  selector:
    matchLabels:
      app: transaction-service
  namespaceSelector:
    matchNames: ["finledger"]
  endpoints:
    - port: http # must match the named port below in the Service — see services-updates/ notes
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ledger-service
  namespace: finledger
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: ledger-service
  namespaceSelector:
    matchNames: ["finledger"]
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
# CAVEAT: the exact Service name/port YACE's Helm chart creates can vary by
# chart version. Verify with `kubectl get svc -n monitoring` after installing
# YACE and adjust `matchLabels`/`port` below to match what's actually there
# before assuming this ServiceMonitor is correctly wired — written honestly
# as "verify this" rather than a guessed value presented as certain.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cloudwatch-exporter
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: yet-another-cloudwatch-exporter
  namespaceSelector:
    matchNames: ["monitoring"]
  endpoints:
    - port: http-metrics # VERIFY this against the actual Service's port name
      path: /metrics
      interval: 60s # CloudWatch metrics don't update faster than ~60s anyway, no benefit scraping more frequently