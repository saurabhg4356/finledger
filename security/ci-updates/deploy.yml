name: Build, Scan, Push, Deploy

# UPDATED from Phase 5 — changes from the original:
#   1. matrix.service now includes all 6 services (Phase 5 only had 3)
#   2. Trivy now also outputs SARIF, uploaded to GitHub's Security tab —
#      findings are visible in the repo UI, not just a pass/fail workflow log
#   3. A new, separate job scans the Terraform itself for misconfigurations
#      (unencrypted resources, overly permissive security groups, etc.) —
#      this is "shift-left" applied to infrastructure, not just app images
#
# FIX (this version): matrix.service is now a flat list of plain service
# names (strings), not objects with .name/.path. Every step below already
# referenced it as ${{ matrix.service }} (a plain string) EXCEPT the matrix
# definition itself, which still had { name, path } objects — that mismatch
# is what was breaking every job. The "Determine build context" step below
# figures out the path automatically, so we don't need `path` in the matrix
# at all anymore.

on:
  push:
    branches: [main]
    paths:
      - "core-services/services/**"
      - "async/services/**"
      - "**/*.tf"
      - ".github/workflows/deploy.yml"

permissions:
  id-token: write
  contents: read
  security-events: write # required for the SARIF upload step

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: finledger-cluster
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  build-scan-push-deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: account-service,       path: core-services/services/account-service }
          - { name: ledger-service,        path: core-services/services/ledger-service }
          - { name: transaction-service,   path: core-services/services/transaction-service }
          - { name: outbox-poller,         path: async/services/outbox-poller }
          - { name: fraud-service,         path: async/services/fraud-service }
          - { name: notification-service,  path: async/services/notification-service }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Determine build context
        id: context
        run: |
          # outbox-poller/fraud-service/notification-service live under
          # async/, the original three under core-services/ —
          # this picks the right path per matrix entry instead of hardcoding one.
          if [ -d "async/services/${{ matrix.service }}" ]; then
            echo "path=async/services/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          else
            echo "path=core-services/services/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        run: |
          docker build \
            -t "${{ env.ECR_REGISTRY }}/finledger-${{ matrix.service }}:${{ github.sha }}" \
            "${{ steps.context.outputs.path }}"

      - name: Scan image with Trivy (human-readable, fails the build)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: "${{ env.ECR_REGISTRY }}/finledger-${{ matrix.service }}:${{ github.sha }}"
          format: table
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true

      - name: Scan image with Trivy (SARIF, for GitHub Security tab)
        if: always() # run even if the step above already failed the build — findings should still be visible
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: "${{ env.ECR_REGISTRY }}/finledger-${{ matrix.service }}:${{ github.sha }}"
          format: sarif
          output: trivy-results-${{ matrix.service }}.sarif
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results-${{ matrix.service }}.sarif
          category: "trivy-${{ matrix.service }}"

      - name: Push image to ECR
        run: |
          docker push "${{ env.ECR_REGISTRY }}/finledger-${{ matrix.service }}:${{ github.sha }}"

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name "${{ env.EKS_CLUSTER_NAME }}" --region "${{ env.AWS_REGION }}"

      - name: Deploy — set image and wait for rollout
        run: |
          kubectl set image deployment/${{ matrix.service }} \
            ${{ matrix.service }}="${{ env.ECR_REGISTRY }}/finledger-${{ matrix.service }}:${{ github.sha }}" \
            -n finledger
          kubectl rollout status deployment/${{ matrix.service }} -n finledger --timeout=240s

  scan-terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy config scan (Terraform misconfigurations)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: config
          scan-ref: "."
          format: sarif
          output: trivy-config-results.sarif
          severity: "CRITICAL,HIGH"
          exit-code: "0" # report-only for now — flip to "1" once the backlog of findings is triaged, so this doesn't block every push on day one

      - name: Upload Terraform scan SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-config-results.sarif
          category: "trivy-terraform-config"