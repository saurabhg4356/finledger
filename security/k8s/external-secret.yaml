# ------------------------------------------------------------------------------
# This REPLACES the manually-run `kubectl create secret generic
# finledger-db-credentials ...` command from Phase 5. Same Secret name (so no
# Deployment envFrom references need to change), but now continuously synced
# from AWS Secrets Manager instead of a one-time manual paste. Rotate the
# password in Secrets Manager and this Secret updates within
# refreshInterval — no human touches a password again in the steady state.
# ------------------------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: finledger-db-credentials
  namespace: finledger
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: finledger-db-credentials # same name every Deployment's envFrom already references
    creationPolicy: Owner
  data:
    - secretKey: DB_USER
      remoteRef:
        key: finledger/rds/master-credential
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: finledger/rds/master-credential
        property: password
    - secretKey: DB_HOST
      remoteRef:
        key: finledger/app/connection-config
        property: DB_HOST
    - secretKey: DB_NAME
      remoteRef:
        key: finledger/app/connection-config
        property: DB_NAME
    - secretKey: REDIS_HOST
      remoteRef:
        key: finledger/app/connection-config
        property: REDIS_HOST