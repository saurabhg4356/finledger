apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: finledger
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        # jwt + serviceAccountRef means ESO uses the "external-secrets"
        # ServiceAccount's own IRSA identity to authenticate to AWS — no
        # static AWS keys anywhere in this manifest or in the cluster.
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: finledger