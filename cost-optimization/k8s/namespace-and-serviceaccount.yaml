apiVersion: v1
kind: Namespace
metadata:
  name: fargate-container-insights
  labels:
    project: finledger
---
# The official AWS ADOT Fargate manifest (otel-fargate-container-insights.yaml)
# references this ServiceAccount by name but doesn't define it — AWS's guide
# assumes eksctl created it as part of an `eksctl create iamserviceaccount`
# command. Since this project provisions IAM entirely through Terraform
# (consistent with every prior phase), it's defined explicitly here instead,
# annotated with the IRSA role from terraform/main.tf. Replace <ACCOUNT_ID>.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: adot-collector
  namespace: fargate-container-insights
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::788292453615:role/finledger-adot-collector-role