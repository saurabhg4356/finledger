name: Build, Scan, Push, Deploy

on:
  push:
    branches: [main]
    paths:
      - "core-services/services/**"
      - ".github/workflows/deploy.yml"

permissions:
  id-token: write   # required to mint the OIDC token for AssumeRoleWithWebIdentity
  contents: read

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: finledger-cluster
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  build-scan-push-deploy:
    runs-on: ubuntu-latest
    strategy:
      # fail-fast: false so one service's failure doesn't cancel the others —
      # you want to see all three results, not just the first failure.
      fail-fast: false
      matrix:
        service: [account-service, ledger-service, transaction-service]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC (no long-lived secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: |
          docker build \
            -t "${{ env.ECR_REGISTRY }}/finledger-${{ matrix.service }}:${{ github.sha }}" \
            "core-services/services/${{ matrix.service }}"

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: "${{ env.ECR_REGISTRY }}/finledger-${{ matrix.service }}:${{ github.sha }}"
          format: table
          # Fail the build on HIGH/CRITICAL findings — this is the actual
          # "shift-left security" gate, not just a report nobody reads.
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true # don't fail the build on vulnerabilities with no available fix yet — nothing actionable to do about those today

      # Only reached if the Trivy step above passed (exit-code 0).
      - name: Push image to ECR
        run: |
          docker push "${{ env.ECR_REGISTRY }}/finledger-${{ matrix.service }}:${{ github.sha }}"

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name "${{ env.EKS_CLUSTER_NAME }}" --region "${{ env.AWS_REGION }}"

      - name: Deploy — set image and wait for rollout
        run: |
          kubectl set image deployment/${{ matrix.service }} \
            ${{ matrix.service }}="${{ env.ECR_REGISTRY }}/finledger-${{ matrix.service }}:${{ github.sha }}" \
            -n finledger

          # This is what actually catches a broken deploy in CI instead of
          # discovering it later — if the new pods never go Ready (bad image,
          # crash loop, failing readiness probe), this step fails the workflow.
          kubectl rollout status deployment/${{ matrix.service }} -n finledger --timeout=180s