name: Build, Scan, Push, Deploy

on:
  push:
    branches: [main]
    paths:
      - "core-services/services/**"
      - "async/services/**"
      - ".github/workflows/deploy.yml"

permissions:
  id-token: write   # required to mint the OIDC token for AssumeRoleWithWebIdentity
  contents: read

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: finledger-cluster
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  build-scan-push-deploy:
    runs-on: ubuntu-latest
    strategy:
      # fail-fast: false so one service's failure doesn't cancel the others —
      # you want to see all results, not just the first failure.
      fail-fast: false
      matrix:
        service:
          - { name: account-service,       path: core-services/services/account-service }
          - { name: ledger-service,        path: core-services/services/ledger-service }
          - { name: transaction-service,   path: core-services/services/transaction-service }
          - { name: outbox-poller,         path: async/services/outbox-poller }
          - { name: fraud-service,         path: async/services/fraud-service }
          - { name: notification-service,  path: async/services/notification-service }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC (no long-lived secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: |
          docker build \
            -t "${{ env.ECR_REGISTRY }}/finledger-${{ matrix.service.name }}:${{ github.sha }}" \
            "${{ matrix.service.path }}"

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: "${{ env.ECR_REGISTRY }}/finledger-${{ matrix.service.name }}:${{ github.sha }}"
          format: table
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true

      - name: Push image to ECR
        run: |
          docker push "${{ env.ECR_REGISTRY }}/finledger-${{ matrix.service.name }}:${{ github.sha }}"

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name "${{ env.EKS_CLUSTER_NAME }}" --region "${{ env.AWS_REGION }}"

      - name: Deploy — set image and wait for rollout
        run: |
          kubectl set image deployment/${{ matrix.service.name }} \
            ${{ matrix.service.name }}="${{ env.ECR_REGISTRY }}/finledger-${{ matrix.service.name }}:${{ github.sha }}" \
            -n finledger

          kubectl rollout status deployment/${{ matrix.service.name }} -n finledger --timeout=240s